<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Buddy's cafe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <section>
        <nav>
            <div class="logo">
                <span>Dine</span>
                <p>X</p>
            </div>

            <ul>
                <li><a href="index.html" target="_blank">Home</a></li>
                <li><a href="index.html" target="_blank">About</a></li>
                <li><a href="menu.html" target="_blank">Menu</a></li>
                <li><a href="gallary.html" target="_blank">Gallery</a></li>
                <li><a href="review.html" target="_blank">Review</a></li>
                <li><a href="order.html">Order</a></li>
            </ul>

            <div class="icon">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-twitter"></i>
            </div>


        </nav>


        <div class="order">
            <h1><span>Book</span>your<span>Table</span>Now</h1>

            <div class="order_main">


                <form id="bookingForm">

                    <div class="input">
                        <p>Name</p>
                        <input type="text" name="name" placeholder="Enter your name" required>
                    </div>
                    <div class="input">
                        <p>E-mail</p>
                        <input type="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input">
                        <p>Mobile Number</p>
                        <input type="tel" name="mobile" placeholder="Mobile number" required>
                    </div>
                    <div class="input">
                        <p>NO. of Person</p>
                        <input type="number" name="persons" placeholder="No. of persons" min="1" required>
                    </div>
                    <div class="input">
                        <p>Dinning Time</p>
                        <input type="time" name="diningTime" required>
                    </div>

                    <button type="submit" class="order_btn">Book Table</button>
                    <p class="form_message" id="bookingMessage"></p>
                </form>

                <div class="order_image">
                    <img src="images/booking1.jpg" alt="">
                </div>
            </div>
        </div>

    </section>
    <script src="js/config.js"></script>
    <script src="js/forms.js"></script>
</body>
